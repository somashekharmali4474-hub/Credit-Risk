
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Customer Credit Risk - Login</title>
</head>
<body>

<h2>Customer Credit Management</h2>
<h3>Login</h3>

<form id="loginForm">

    <input type="email"
           id="email"
           placeholder="Enter Email"
           required>

    <br><br>

    <input type="password"
           id="password"
           placeholder="Enter Password"
           required>

    <br><br>

    <p id="message"></p>

    <button type="submit" id="loginButton">
        Login
    </button>

</form>

<p>
    Don't have an account?
    <a href="/register.html">Register here</a>
</p>

<script src="/js/login.js"></script>

</body>
</html>
